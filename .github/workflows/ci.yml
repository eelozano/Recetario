name: CI

# Runs on every PR into main (the review gate) and on pushes to main (keeps the
# trunk green). The backend suite is hermetic — in-memory SQLite, mocked
# LLM/FDC/Google — so no secrets or services are needed.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (with dev extras)
        run: pip install -e '.[dev]'

      - name: Run tests
        run: pytest

  core:
    name: Core (vitest + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      # Root npm workspace; @recetario/core is the only member. Pure unit tests
      # (decimal.js math, no network/fs) — the portable domain's regression gate.
      - name: Install workspace deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace @recetario/core

      - name: Build (emit dist/ consumed by the desktop shell)
        run: npm run build --workspace @recetario/core

      - name: Test
        run: npm test --workspace @recetario/core

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      # desktop is now a member of the root npm workspace and depends on the
      # built @recetario/core, so install at the root (symlinks the core) and
      # build the core's dist before the UI consumes it.
      - name: Install workspace deps
        run: npm ci

      - name: Build core
        run: npm run build --workspace @recetario/core

      # `npm run build` is `tsc && vite build` — catches type errors and a broken
      # build. The Rust/Tauri shell is not built here (no native toolchain needed
      # to validate the web UI); packaging is verified manually before release.
      - name: Typecheck and build UI
        run: npm run build --workspace desktop
