[project]
name = "recetario"
version = "0.1.0"
description = "Recetario recipe-import helper — recipe-scrapers / yt-dlp / Claude extraction sidecar"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "recipe-scrapers>=15.0",
    "anthropic>=0.40",
    "yt-dlp>=2024.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Build-time only: freezes helper.py into the single-file sidecar binary that
# Tauri ships. Not needed at runtime. See packaging/recetario-helper.spec.
build = [
    "pyinstaller>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
